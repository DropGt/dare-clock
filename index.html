<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Group Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .container { width: 100%; max-width: 500px; background: white; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Auth Screen */
        #auth-screen { padding: 40px 20px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 95%; padding: 10px; margin: 5px 0; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .google-btn { background: #db4437; }
        .google-btn:hover { background: #c23321; }

        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-header { background: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header button { width: auto; margin: 0; padding: 5px 10px; background: #dc3545; }
        #messages-container { flex: 1; padding: 15px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }
        
        .message { background: white; padding: 10px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .message small { display: block; color: #888; font-size: 0.8em; margin-bottom: 5px; }
        .message img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        
        .chat-input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ccc; }
        .chat-input-area input[type="text"] { flex: 1; margin: 0; border-radius: 20px; padding: 10px 15px; }
        .chat-input-area input[type="file"] { display: none; }
        .file-label { display: flex; align-items: center; justify-content: center; background: #28a745; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; margin: 0 10px; }
        .chat-input-area button { width: 60px; margin: 0; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login / Sign Up Screen -->
    <div id="auth-screen">
        <h2>Welcome to the Chat</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="signUp()">Sign Up</button>
        <button onclick="signIn()">Sign In</button>
        <hr style="margin: 20px 0;">
        <button class="google-btn" onclick="signInWithGoogle()">Sign in with Google</button>
        <p id="auth-error" style="color: red; font-size: 0.9em;"></p>
    </div>

    <!-- Chat Interface -->
    <div id="chat-screen">
        <div class="chat-header">
            <span>Group Chat</span>
            <button onclick="signOut()">Log Out</button>
        </div>
        <div id="messages-container"></div>
        <div class="chat-input-area">
            <label class="file-label" for="image-upload">📷</label>
            <input type="file" id="image-upload" accept="image/*" onchange="sendImage()">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    // Properly extract createClient from the global Supabase script
    const { createClient } = supabase;

    // Initialize Supabase with your exact keys
    const SUPABASE_URL = 'https://egzkmrddetiggrcvrjoq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnemttcmRkZXRpZ2dyY3Zyam9xIkwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzMxNDcsImV4cCI6MjEwNDkwOTE0N30.pUtxuahj42tUlOMGGSKFZ7T0UERauzdgNQOOfgBx1Ws';
    
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // --- Authentication Logic ---

    // Automatically check if the device is already logged in
    client.auth.onAuthStateChange((event, session) => {
        if (session) {
            currentUser = session.user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            loadMessages();
            subscribeToRealtime();
        } else {
            currentUser = null;
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('chat-screen').style.display = 'none';
        }
    });

    async function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await client.auth.signUp({ email, password });
        if (error) document.getElementById('auth-error').innerText = error.message;
        else alert('Success! You can now sign in (check your email to verify if required).');
    }

    async function signIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) document.getElementById('auth-error').innerText = error.message;
    }

    async function signInWithGoogle() {
        const { error } = await client.auth.signInWithOAuth({ provider: 'google' });
        if (error) document.getElementById('auth-error').innerText = error.message;
    }

    async function signOut() {
        await client.auth.signOut();
    }

    // --- Chat & Realtime Logic ---

    const messagesContainer = document.getElementById('messages-container');

    async function loadMessages() {
        const { data, error } = await client.from('messages').select('*').order('created_at', { ascending: true });
        if (data) {
            messagesContainer.innerHTML = '';
            data.forEach(displayMessage);
            scrollToBottom();
        }
    }

    // Listen for new messages sent by other devices
    function subscribeToRealtime() {
        client.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                displayMessage(payload.new);
                scrollToBottom();
            })
            .subscribe();
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !currentUser) return;
        input.value = '';

        await client.from('messages').insert([
            { user_email: currentUser.email, text_content: text }
        ]);
    }

    // --- Image Upload Logic ---

    async function sendImage() {
        const fileInput = document.getElementById('image-upload');
        const file = fileInput.files[0];
        if (!file || !currentUser) return;

        // Generate a unique file name
        const filePath = `${Date.now()}_${file.name}`;

        // Upload to Supabase Storage
        const { error: uploadError } = await client.storage.from('chat_images').upload(filePath, file);
        
        if (uploadError) {
            alert('Error uploading image: ' + uploadError.message);
            return;
        }

        // Get the public URL of the uploaded image
        const { data: urlData } = client.storage.from('chat_images').getPublicUrl(filePath);
        
        // Save the image URL as a message in the database
        await client.from('messages').insert([
            { user_email: currentUser.email, image_url: urlData.publicUrl }
        ]);

        fileInput.value = ''; // Reset input
    }

    // --- UI Helpers ---

    function displayMessage(msg) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        
        let contentHtml = `<small>${msg.user_email}</small>`;
        if (msg.text_content) contentHtml += `<div>${msg.text_content}</div>`;
        if (msg.image_url) contentHtml += `<img src="${msg.image_url}" alt="Chat Image">`;
        
        msgDiv.innerHTML = contentHtml;
        messagesContainer.appendChild(msgDiv);
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
</script>

</body>
</html>
