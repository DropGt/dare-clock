<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dare Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 500px; height: 100%; position: relative; background: #111; overflow: hidden; }

        /* Screens */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: #111; transition: transform 0.3s ease; }
        .screen.active { display: flex; z-index: 10; animation: fadeIn 0.3s ease; }

        /* Auth Screen */
        #auth-screen { padding: 40px 20px; justify-content: center; background: #0f172a; }
        .btn-google { width: 100%; padding: 15px; border-radius: 15px; background: white; color: black; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Camera Tab */
        #camera-screen { background: #000; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay { position: absolute; bottom: 90px; width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; z-index: 20; }
        .capture-btn { width: 75px; height: 75px; border-radius: 50%; border: 4px solid white; background: transparent; cursor: pointer; transition: 0.2s; }
        .capture-btn:active { background: white; transform: scale(0.9); }
        .ui-btn { padding: 12px 20px; border-radius: 20px; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); color: white; border: 1px solid rgba(255,255,255,0.2); font-weight: 600; cursor: pointer; }

        /* DM & Groups Tab */
        #chat-list-screen { background: #0f172a; padding-bottom: 70px; }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; background: #0f172a; z-index: 20; }
        .header h2 { font-size: 1.5rem; }
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        .chat-item { display: flex; align-items: center; padding: 15px; background: #1e293b; border-radius: 15px; margin-bottom: 10px; cursor: pointer; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: #3b82f6; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; margin-right: 15px; text-transform: uppercase; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; }

        .empty-state { text-align: center; color: #64748b; padding: 40px 20px; font-size: 0.95rem; }

        /* Active Chat Room View */
        #active-chat-screen { background: #0f172a; z-index: 30; transform: translateX(100%); }
        #active-chat-screen.active { transform: translateX(0); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 0.95rem; word-wrap: break-word; }
        .msg-received { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-sent { background: #3b82f6; align-self: flex-end; border-bottom-right-radius: 4px; }

        .chat-input { display: flex; padding: 15px; background: #0f172a; border-top: 1px solid #1e293b; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px 20px; border-radius: 25px; border: none; background: #1e293b; color: white; outline: none; }
        .chat-input button { padding: 0 20px; border-radius: 25px; background: #3b82f6; color: white; border: none; font-weight: 600; cursor: pointer; }

        /* Bottom Nav */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; z-index: 50; border-top: 1px solid #1e293b; }
        .nav-item { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .nav-item.active { opacity: 1; transform: translateY(-3px); }
        .nav-item svg { width: 28px; height: 28px; fill: white; }

        /* Profile Modal */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; }
        .input-box { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; outline: none; }
        .btn-primary { width: 100%; padding: 15px; border-radius: 15px; background: #3b82f6; color: white; font-weight: 600; border: none; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Login Screen -->
    <div id="auth-screen" class="screen active">
        <h1 style="text-align: center; margin-bottom: 30px; font-size: 2rem;">Dare Chat</h1>
        <button class="btn-google" onclick="signInWithGoogle()">
            <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Continue with Google
        </button>
    </div>

    <!-- Camera Tab -->
    <div id="camera-screen" class="screen">
        <video id="camera-feed" autoplay playsinline></video>
        <div class="camera-overlay">
            <button class="ui-btn" onclick="alert('Posts feed coming soon!')">📰 Posts</button>
            <button class="capture-btn" onclick="alert('Photo taken! (Saving feature coming soon)')"></button>
            <button class="ui-btn">🔄 Flip</button>
        </div>
    </div>

    <!-- Chat List Tab -->
    <div id="chat-list-screen" class="screen">
        <div class="header">
            <h2>Chats</h2>
        </div>
        <div class="chat-list" id="chat-list-container">
            <!-- Dynamic users will load here -->
        </div>
    </div>

    <!-- Active Chat Room View -->
    <div id="active-chat-screen" class="screen">
        <div class="header">
            <button style="background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;" onclick="closeChat()">←</button>
            <h2 id="active-chat-title">Chat</h2>
            <div style="width:24px;"></div>
        </div>
        
        <div class="chat-messages" id="messages-container">
            <!-- Messages load here -->
        </div>
        
        <div class="chat-input">
            <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendDM()">
            <button onclick="sendDM()">Send</button>
        </div>
    </div>

    <!-- Profile Enforcement Modal -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Complete Your Profile</h3>
            <input type="text" id="reg-fname" class="input-box" placeholder="First Name">
            <input type="text" id="reg-lname" class="input-box" placeholder="Last Name">
            <input type="text" id="reg-username" class="input-box" placeholder="Username">
            <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav" id="bottom-nav" style="display:none;">
        <div class="nav-item active" onclick="switchTab('camera')">
            <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </div>
        <div class="nav-item" onclick="switchTab('chats')">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
    </div>

</div>

<script>
    const { createClient } = supabase;
    const SUPABASE_URL = 'https://egzkmrddetiggrcvrjoq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnemttcmRkZXRpZ2dyY3Zyam9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzMxNDcsImV4cCI6MjEwNDkwOTE0N30.pUtxuahj42tUlOMGGSKFZ7T0UERauzdgNQOOfgBx1Ws';
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let cameraStream = null;
    let currentChatUserId = null;
    let messageSubscription = null;

    // --- AUTH & PROFILE LOGIC ---
    client.auth.onAuthStateChange(async (event, session) => {
        if (session) {
            currentUser = session.user;
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('bottom-nav').style.display = 'flex';
            switchTab('camera'); 
            await checkProfileEnforcement();
        } else {
            currentUser = null;
            document.getElementById('auth-screen').classList.add('active');
            document.getElementById('bottom-nav').style.display = 'none';
            stopCamera();
        }
    });

    async function signInWithGoogle() {
        await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
    }

    async function checkProfileEnforcement() {
        try {
            const { data, error } = await client.from('profiles').select('*').eq('id', currentUser.id).single();
            
            // If data is null or missing fields, show the popup
            if (!data || !data.username || !data.first_name || !data.last_name) {
                document.getElementById('profile-modal').style.display = 'flex';
            }
        } catch (err) {
            console.error("Profile check failed:", err);
            document.getElementById('profile-modal').style.display = 'flex';
        }
    }

    async function saveProfile() {
        const fname = document.getElementById('reg-fname').value.trim();
        const lname = document.getElementById('reg-lname').value.trim();
        const uname = document.getElementById('reg-username').value.trim();

        if (!fname || !lname || !uname) return alert("All fields are required!");

        const { error } = await client.from('profiles').upsert({
            id: currentUser.id,
            email: currentUser.email,
            first_name: fname,
            last_name: lname,
            username: uname
        });

        if (error) {
            alert("Error saving profile: " + error.message);
        } else {
            document.getElementById('profile-modal').style.display = 'none';
            loadUserList(); // Reload chat list with new profile registered
        }
    }

    // --- NAVIGATION ---
    function switchTab(tab) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        if (tab === 'camera') {
            document.getElementById('camera-screen').classList.add('active');
            document.querySelectorAll('.nav-item')[0].classList.add('active');
            startCamera();
        } else if (tab === 'chats') {
            document.getElementById('chat-list-screen').classList.add('active');
            document.querySelectorAll('.nav-item')[1].classList.add('active');
            stopCamera();
            loadUserList(); // Fetch real users from DB
        }
    }

    // --- CAMERA LOGIC ---
    async function startCamera() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('camera-feed').srcObject = cameraStream;
            } catch (err) {
                console.error("Camera error:", err);
            }
        }
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
    }

    // --- REAL CHAT LOGIC ---
    
    // 1. Load available users to chat with
    async function loadUserList() {
        const container = document.getElementById('chat-list-container');
        
        // Fetch all profiles EXCEPT the logged-in user
        const { data, error } = await client.from('profiles').select('*').neq('id', currentUser.id);

        container.innerHTML = ''; // Clear out old list

        if (error || !data || data.length === 0) {
            container.innerHTML = `<div class="empty-state">No chats yet. It's empty here.</div>`;
            return;
        }

        data.forEach(user => {
            const initial = user.first_name ? user.first_name.charAt(0) : '?';
            const fullName = `${user.first_name} ${user.last_name}`;
            
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.onclick = () => openChat(user.id, fullName);
            
            div.innerHTML = `
                <div class="chat-avatar">${initial}</div>
                <div class="chat-info">
                    <div class="chat-name">${fullName}</div>
                    <div style="font-size: 0.85rem; color: #94a3b8;">@${user.username}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // 2. Open a DM room with a specific user
    async function openChat(userId, userName) {
        currentChatUserId = userId;
        document.getElementById('active-chat-title').innerText = userName;
        document.getElementById('active-chat-screen').classList.add('active');
        
        await fetchMessages();
        subscribeToMessages();
    }

    function closeChat() {
        document.getElementById('active-chat-screen').classList.remove('active');
        currentChatUserId = null;
        if (messageSubscription) {
            client.removeChannel(messageSubscription);
            messageSubscription = null;
        }
    }

    // 3. Fetch message history
    async function fetchMessages() {
        const container = document.getElementById('messages-container');
        container.innerHTML = ''; // Clear window

        const { data, error } = await client.from('direct_messages')
            .select('*')
            .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUserId}),and(sender_id.eq.${currentChatUserId},receiver_id.eq.${currentUser.id})`)
            .order('created_at', { ascending: true });

        if (data && data.length === 0) {
             container.innerHTML = `<div class="empty-state" id="no-msg-text">Send a message to say hi!</div>`;
        } else if (data) {
            data.forEach(msg => renderMessage(msg));
            container.scrollTop = container.scrollHeight;
        }
    }

    // 4. Send a new message
    async function sendDM() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        
        if (!text || !currentChatUserId) return;
        input.value = '';

        // Immediately remove the "Say hi" text if it exists
        const emptyText = document.getElementById('no-msg-text');
        if(emptyText) emptyText.remove();

        const { error } = await client.from('direct_messages').insert([{
            sender_id: currentUser.id,
            receiver_id: currentChatUserId,
            content: text
        }]);

        if (error) alert("Error sending message: " + error.message);
    }

    // 5. Render a single message bubble
    function renderMessage(msg) {
        const container = document.getElementById('messages-container');
        const div = document.createElement('div');
        
        if (msg.sender_id === currentUser.id) {
            div.className = 'msg msg-sent';
        } else {
            div.className = 'msg msg-received';
        }
        
        div.innerText = msg.content;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // 6. Realtime Listener for DMs
    function subscribeToMessages() {
        if (messageSubscription) client.removeChannel(messageSubscription);

        messageSubscription = client.channel('public:direct_messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages' }, payload => {
                const newMsg = payload.new;
                // Only render if this message belongs to the current open chat
                if (
                    (newMsg.sender_id === currentUser.id && newMsg.receiver_id === currentChatUserId) ||
                    (newMsg.sender_id === currentChatUserId && newMsg.receiver_id === currentUser.id)
                ) {
                    const emptyText = document.getElementById('no-msg-text');
                    if(emptyText) emptyText.remove();
                    
                    renderMessage(newMsg);
                }
            })
            .subscribe();
    }
</script>

</body>
</html>
